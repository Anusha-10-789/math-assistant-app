services:
  - type: web
    name: math-assistant-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Required — set these in the Render dashboard after the first deploy
      # (Environment tab), not in this file, so real secrets never end up in
      # the repo.
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # CORS_ORIGINS and FRONTEND_URL both need the frontend's actual
      # https://...onrender.com URL, which only exists after the frontend
      # service below is first created — fill these in afterwards, then
      # redeploy this service.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional features — leave unset to keep them hidden/disabled, see
      # backend/.env.example for what each one does.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

  - type: web
    name: math-assistant-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Needs the backend's actual https://...onrender.com URL, which only
      # exists after the backend service above is first created — fill in
      # after that, then redeploy this service (Vite bakes this in at BUILD
      # time, so a redeploy — not just an env var change — is required).
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Client-side routing fallback — not strictly needed today (this app
      # has no router), but harmless and future-proofs a static SPA deploy.
      - type: rewrite
        source: /*
        destination: /index.html
